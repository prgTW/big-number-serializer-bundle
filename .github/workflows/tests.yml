name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / JMS Serializer ${{ matrix.serializer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
        symfony:
          - ^2.8
          - ^3.0
          - ^4.0
          - ^5.4
        serializer:
          - ^1.5
          - ^3.0
        exclude:
          - php: '7.4'
            symfony: ^2.8
            serializer: ^3.0
          - php: '8.0'
            symfony: ^2.8
            serializer: ^1.5
          - php: '8.0'
            symfony: ^2.8
            serializer: ^3.0
          - php: '8.0'
            symfony: ^3.0
            serializer: ^1.5
          - php: '8.0'
            symfony: ^4.0
            serializer: ^1.5
          - php: '7.4'
            symfony: ^5.4
            serializer: ^1.5
          - php: '8.0'
            symfony: ^5.4
            serializer: ^1.5
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: json, libxml
        coverage: none
        tools: composer:v2

    - name: Install dependencies
      run: |
        composer remove --dev roave/security-advisories --no-update
        composer require \
          'symfony/config:${{ matrix.symfony }}' \
          'symfony/dependency-injection:${{ matrix.symfony }}' \
          'symfony/http-kernel:${{ matrix.symfony }}' \
          'jms/serializer:${{ matrix.serializer }}' \
          --prefer-dist --no-progress --no-security-blocking

    - name: PHPUnit
      run: composer test
